name: Export Charmed Life source bundles

on:
  push:
    branches:
      - artifact/export-charmed-life-epub3-bundle
  pull_request:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current content
        uses: actions/checkout@v4
        with:
          lfs: true
          path: current

      - name: Checkout mapped v6 source archive revision
        uses: actions/checkout@v4
        with:
          ref: 67c974e8067b9b800cae2daa569629e5acbaf442
          lfs: true
          path: mapped-bundle-source

      - name: Checkout final dropcaps-fixed generated content revision
        uses: actions/checkout@v4
        with:
          ref: 67b39536da0a25880b8a9c5af43460ef6494f385
          lfs: false
          path: generated-content

      - name: Diagnose source packages
        shell: bash
        run: |
          set -u
          source_zip="current/source/EPUB/EN/Charmed_Life_bundle_EPUB3_Chrestomanci.zip"
          mapped_zip="mapped-bundle-source/source/EPUB/EN/Charmed_Life_mapped_translation_bundle_v6_EPUB3.zip"
          for path in "$source_zip" "$mapped_zip"; do
            echo "=== $path"
            ls -lh "$path" || true
            file "$path" || true
            unzip -t "$path" >/dev/null && echo "ZIP_OK" || echo "ZIP_INVALID_OR_POINTER"
            head -c 160 "$path" | xxd || true
          done

      - name: Archive generated full-book Raw SimAlign payloads
        shell: bash
        run: |
          set -euo pipefail
          root="generated-content/data/series/chrestomanci/books/mapped-bundle-charmed-life-en-ru-v6-epub3-dropcaps-fixed"
          test -d "$root"
          mapfile -d '' files < <(find "$root" -type f -name parallel-vocabulary.json -print0 | sort -z)
          test "${#files[@]}" -gt 0
          printf '%s\0' "${files[@]}" | xargs -0 zip -q Charmed_Life_full_book_parallel_vocabulary.zip
          printf '%s\n' "parallel-vocabulary files: ${#files[@]}"

      - name: Upload source EPUB3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Charmed_Life_bundle_EPUB3_Chrestomanci
          path: current/source/EPUB/EN/Charmed_Life_bundle_EPUB3_Chrestomanci.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload mapped translation bundle v6
        uses: actions/upload-artifact@v4
        with:
          name: Charmed_Life_mapped_translation_bundle_v6_EPUB3
          path: mapped-bundle-source/source/EPUB/EN/Charmed_Life_mapped_translation_bundle_v6_EPUB3.zip
          if-no-files-found: error
          retention-days: 1

      - name: Upload full-book Raw SimAlign payloads
        uses: actions/upload-artifact@v4
        with:
          name: Charmed_Life_full_book_parallel_vocabulary
          path: Charmed_Life_full_book_parallel_vocabulary.zip
          if-no-files-found: error
          retention-days: 1
